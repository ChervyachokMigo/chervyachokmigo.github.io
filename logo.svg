<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 240 262" width="240" height="262">
  <defs>
    <!-- Градиент самой молнии: белый сердечник → золото -->
    <linearGradient id="boltGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="22%"  stop-color="#FFF9C4"/>
      <stop offset="55%"  stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>

    <!-- Двухслойное свечение -->
    <filter id="boltGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b1"/>
      <feFlood flood-color="#00E5FF" flood-opacity="0.85" result="c1"/>
      <feComposite in="c1" in2="b1" operator="in" result="glow1"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b2"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.75" result="c2"/>
      <feComposite in="c2" in2="b2" operator="in" result="glow2"/>

      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="glow2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Контур: верхняя планка + зигзагообразная диагональ + нижняя планка -->
  <path
    d="M30 20
       L170 20
       L170 48
       L128 88
       L152 96
       L98 142
       L118 150
       L80 178
       L170 178
       L170 202
       L30 202
       L30 178
       L120 48
       L30 48
       Z"
    fill="url(#boltGrad)"
    stroke="#FFFFFF"
    stroke-width="1.5"
    stroke-linejoin="round"
    filter="url(#boltGlow)"/>
</svg>